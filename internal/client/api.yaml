  /stencils/site/{site}:
    get:
      tags:
        - Stencils
      summary: List stencils by site
      description: |
        Get list of stencils available at a specific site.

        This filter can be combined with other filters in any order:
        - `/stencils/site/{site}/public` - Public stencils at site
        - `/stencils/site/{site}/private` - Private stencils at site
        - `/stencils/site/{site}/product_group/{id}` - Product group stencils at site
        - `/stencils/site/{site}/my_stencils` - User's stencils at site

        Updated from actual API testing on 2026-04-13
      operationId: listStencilsBySite
      parameters:
        - name: site
          in: path
          required: true
          description: Site name (svl or rtp)
          schema:
            type: string
            enum: [svl, rtp]
      responses:
        '200':
          description: Successful response
          content:
