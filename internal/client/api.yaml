openapi: 3.0.0
info:
  title: Fyre API
  description: |
    API for managing virtual machines, clusters, and stencils in the Fyre development environment.

    ## Authentication
    This API uses HTTP Basic Authentication with your Fyre username and API key. You must be on
    the VPN to use the API.

    ## Sites
    The API is available at two sites:
    - SVL (San Jose, Silicon Valley Labs)
    - RTP (Raleigh, Research Triangle Park)

    You can specify the site using the `site` query parameter or in the request body.
    Default site is SVL if not specified.

    ## VM Identifiers
    Many endpoints accept a VM identifier which can be:
    - VM ID (format: x-xxxxxxx)
    - IP address
    - Fully Qualified Domain Name (FQDN) - must be in DNS
  version: 1.0.0
  contact:
    name: DevIT Support
    url: https://w3.ibm.com/w3publisher/devit/support
  termsOfService: https://terms.devit.ibm.com/tous/12
  license:
    name: Mozilla Public License 2.0
    url: https://www.mozilla.org/en-US/MPL/2.0/

servers:
  - url: https://ocpapi.svl.ibm.com/v1
    description: SVL (San Jose) Production Server

security:
  - basicAuth: []

tags:
  - name: Quota
    description: Operations related to quota management
  - name: VMs
    description: Operations for managing virtual machines
  - name: VM Actions
    description: Power and state management operations for VMs
  - name: Stencils
    description: Operations for creating and managing VM templates (stencils)
  - name: Snapshots
    description: Operations for managing VM snapshots
  - name: Clusters
    description: Operations for managing VM clusters
  - name: Users
    description: Operations related to user information
  - name: Networking
    description: Operations for managing IP addresses and networking

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using Fyre username and API key

  parameters:
    vmIdentifier:
      name: vm_identifier
      in: path
      required: true
      description: VM identifier (can be VM ID, IP address, or FQDN)
      schema:
        type: string
      example: x-1234567

    clusterIdentifier:
      name: cluster_identifier
      in: path
      required: true
      description: Cluster identifier (can be cluster ID or name)
      schema:
        type: string

    productGroupId:
      name: product_group_id
      in: path
      required: true
      description: Product group identifier
      schema:
        type: string

    stencilId:
      name: stencil_id
      in: path
      required: true
      description: Stencil identifier
      schema:
        type: string

    requestId:
      name: request_id
      in: path
      required: true
      description: Request identifier
      schema:
        type: string

    platform:
      name: platform
      in: path
      required: true
      description: Platform type
      schema:
        type: string
        enum: [x, pvm, z]
      example: x

    hostname:
      name: hostname
      in: path
      required: true
      description: Hostname to check availability
      schema:
        type: string

    search:
      name: search
      in: path
      required: true
      description: Search term (email or name)
      schema:
        type: string

    vmAction:
      name: action
      in: path
      required: true
      description: VM power action
      schema:
        type: string
        enum: [boot, shutdown, reboot]

    userIdentifier:
      name: user_identifier
      in: path
      required: true
      description: User identifier (can be user ID, username, or email)
      schema:
        type: string

    vipType:
      name: vip_type
      in: path
      required: true
      description: Virtual IP type
      schema:
        type: string
        enum: [private, public]

    vipCount:
      name: count
      in: path
      required: false
      description: Number of IPs to allocate
      schema:
        type: integer
        minimum: 1

    vipSequential:
      name: sequential
      in: path
      required: false
      description: Request sequential IPs
      schema:
        type: string
        enum: [sequential]

    siteQuery:
      name: site
      in: query
      required: false
      description: Site location (svl or rtp)
      schema:
        type: string
        enum: [svl, rtp]
        default: svl

  schemas:
    ClusterCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Cluster name
        description:
          type: string
          description: URL-encoded description

    ClusterDetails:
      # Updated from actual API response on 2026-04-13
      type: object
      properties:
        cluster:
          type: object
          properties:
            id:
              type: integer
            user_id:
              type: integer
            name:
              type: string
            description:
              type: string
            created:
              type: string
              description: Cluster creation timestamp
            updated:
              type: string
              description: Cluster last update timestamp
            vms:
              type: array
              description: VM details (only present when include_vms is used)
              items:
                $ref: '#/components/schemas/VMSummary'

    ClusterList:
      # Updated from actual API response on 2026-04-14
      type: object
      properties:
        cluster_count:
          type: integer
          description: Total number of clusters
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterSummary'

    ClusterSummary:
      type: object
      properties:
        id:
          type: integer
          description: Cluster ID
        name:
          type: string
          description: Cluster name
        description:
          type: string
          description: Cluster description
        created:
          type: string
          description: Cluster creation timestamp
          example: "2026-04-13 16:00:49"
        updated:
          type: string
          description: Cluster last update timestamp
          example: "2026-04-13 16:00:49"
        vm_count:
          type: integer
          description: Number of VMs in the cluster

    ClusterUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Cluster name
        description:
          type: string
          description: URL-encoded description

    ClusterVMRequest:
      type: object
      required:
        - vm_id
      properties:
        vm_id:
          type: array
          items:
            type: string
          description: Array of VM IDs

    Error:
      # Updated from actual API response on 2026-04-22
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Error message description
        details:
          description: Human-readable details about the error. Live create-VM validation
            errors may return either a plain string or an object containing an errors array.
          oneOf:
            - type: string
              example: "VM password has not been changed because the vm is not running"
            - type: object
              properties:
                errors:
                  type: array
                  items:
                    type: string
                  example:
                    - invalid os provided
                    - node has non-numeric value for additional disk specified
              additionalProperties: true

    ExpirationUpdate:
      type: object
      required:
        - expiration
      properties:
        expiration:
          type: string
          description: Expiration time in hours or "X days X hours" format (max 90 days)

    FloatingIPRequest:
      type: object
      required:
        - floating_ip
      properties:
        floating_ip:
          type: string
          description: Floating IP address

    HostnameCheck:
      # Updated from actual API response on 2026-04-13
      type: object
      properties:
        status:
          type: string
          enum: [success, warning]
          description: "success if hostname is available, warning if in use"
        details:
          type: string
          description: "Human-readable message about hostname availability"
        fqdn:
          type: string
          description: "Fully qualified domain name (only present when status is success)"
        owning_user:
          type: integer
          description: "User ID of current owner (only present when status is warning)"
        owner:
          type: object
          description: "Owner details (only present when status is warning)"
          properties:
            id:
              type: integer
            username:
              type: string
            email:
              type: string
        vm_id:
          type: string
          description: "VM ID of the VM using this hostname (only present when status is warning)"

    NFSClientsList:
      type: object
      properties:
        status:
          type: string
        clients:
          type: array
          items:
            type: object
            properties:
              ip_address:
                type: string
              mount_point:
                type: string

    NFSNameCheck:
      type: object
      properties:
        status:
          type: string
          enum: [success, warning]
        details:
          type: string

    NFSPermission:
      type: object
      properties:
        storage_path:
          type: string
        ip_address:
          type: string
        permission:
          type: string
          enum: [rw, ro]
        root_squash:
          type: string
          enum: [root_squash, no_root_squash]

    NFSPermissionsList:
      type: object
      properties:
        status:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/NFSPermission'

    NFSPermissionsUpdate:
      type: object
      required:
        - storage_array
      properties:
        storage_array:
          type: array
          items:
            type: object
            required:
              - action
              - storage_path
              - ip_address
            properties:
              action:
                type: string
                enum: [add, change, delete]
              storage_path:
                type: string
              ip_address:
                type: string
              permission:
                type: string
                enum: [rw, ro]
              root_squash:
                type: string
                enum: [root_squash, no_root_squash]

    NFSStorageList:
      type: object
      properties:
        status:
          type: string
        storage:
          type: array
          items:
            $ref: '#/components/schemas/NFSStorageSummary'

    NFSStorageRequest:
      type: object
      required:
        - share_name
        - server_name
        - capacity
      properties:
        share_name:
          type: string
        server_name:
          type: string
        capacity:
          type: string
          description: Capacity in GB
        justification:
          type: string
          description: Optional justification

    NFSStorageSummary:
      type: object
      properties:
        storage_name:
          type: string
        server_name:
          type: string
        capacity:
          type: integer
        used:
          type: integer
        available:
          type: integer
        protected:
          type: boolean

    NFSStorageTransfer:
      type: object
      required:
        - new_owner_email
      properties:
        new_owner_email:
          type: string

    OCPClusterBuildRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        ocp_version:
          type: string
        master:
          type: object
          properties:
            count:
              type: integer
            cpu:
              type: integer
            memory:
              type: integer
            disk:
              type: integer
        worker:
          type: array
          items:
            type: object
            properties:
              count:
                type: integer
              cpu:
                type: integer
              memory:
                type: integer
              os_disk:
                type: integer
              additional_disk:
                type: array
                items:
                  type: integer
        infra:
          type: object
          properties:
            cpu:
              type: integer
            memory:
              type: integer
            disk:
              type: integer
        expiration:
          type: string
        quick_burn:
          type: boolean
        size:
          type: string
          enum: [medium, large]

    OCPClusterDetails:
      type: object
      properties:
        cluster_id:
          type: string
        cluster_name:
          type: string
        description:
          type: string
        platform:
          type: string
        ocp_version:
          type: string
        status:
          type: string
        created:
          type: string
        expiration:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/OCPNodeSummary'

    OCPClusterList:
      type: object
      properties:
        status:
          type: string
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/OCPClusterSummary'

    OCPClusterStatus:
      type: object
      properties:
        status:
          type: string
        cluster_status:
          type: string
        details:
          type: string

    OCPClusterSummary:
      type: object
      properties:
        cluster_id:
          type: string
        cluster_name:
          type: string
        platform:
          type: string
        status:
          type: string
        created:
          type: string

    OCPClusterTransfer:
      type: object
      properties:
        comment:
          type: string

    OCPNodeSummary:
      type: object
      properties:
        node_name:
          type: string
        node_type:
          type: string
        cpu:
          type: integer
        memory:
          type: integer
        status:
          type: string

    OCPVersionList:
      type: object
      properties:
        status:
          type: string
        versions:
          type: array
          items:
            type: string

    OCPVMDetails:
      type: object
      properties:
        vm_id:
          type: string
        hostname:
          type: string
        cpu:
          type: integer
        memory:
          type: integer
        disk:
          type: integer
        status:
          type: string

    OCPVMDiskAdd:
      type: object
      required:
        - additional_disk
      properties:
        additional_disk:
          type: array
          items:
            type: integer

    OCPVMResourceUpdate:
      type: object
      properties:
        cpu:
          type: integer
        memory:
          type: integer

    OCPWorkerAdd:
      type: object
      properties:
        count:
          type: integer
        cpu:
          type: integer
        memory:
          type: integer
        os_disk:
          type: integer
        additional_disk:
          type: array
          items:
            type: integer

    OSList:
      # Updated from actual API response on 2026-04-21
      # Response structure verified for x and z platforms across SVL and RTP sites
      type: object
      properties:
        status:
          type: string
          example: success
        operating_systems:
          type: object
          description: Available operating systems organized by distribution
          properties:
            CentOS:
              type: array
              items:
                type: string
              description: Available CentOS versions
            RedHat:
              type: array
              items:
                type: string
              description: Available RedHat versions
            Rocky:
              type: array
              items:
                type: string
              description: Available Rocky Linux versions
            SLES:
              type: array
              items:
                type: string
              description: Available SUSE Linux Enterprise Server versions
            Ubuntu:
              type: array
              items:
                type: string
              description: Available Ubuntu versions
            Windows:
              type: array
              items:
                type: string
              description: Available Windows versions
        default_size:
          type: object
          description: Default and maximum VM sizing constraints
          properties:
            vm:
              type: object
              properties:
                count:
                  type: string
                  description: Default VM count
                cpu:
                  type: string
                  description: Default CPU count
                memory:
                  type: string
                  description: Default memory in GB
                max_count:
                  type: string
                  description: Maximum VM count
                max_cpu:
                  type: string
                  description: Maximum CPU count
                max_memory:
                  type: string
                  description: Maximum memory in GB
                max_disk_count:
                  type: string
                  description: Maximum number of disks
                max_disk_size:
                  type: string
                  description: Maximum disk size in GB
                max_total_disk_size:
                  type: string
                  description: Maximum total disk size in GB
                pvm:
                  type: object
                  description: PVM-specific maximums (may not be present in all responses)
                  properties:
                    max_cpu:
                      type: string
                    max_memory:
                      type: string

    QuotaResponse:
      type: object
      properties:
        status:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              product_group_id:
                type: integer
              product_group_name:
                type: string
              platforms:
                type: array
                items:
                  type: string
              x:
                type: object
                properties:
                  cpu:
                    type: integer
                  cpu_used:
                    type: integer
                  memory:
                    type: integer
                  memory_used:
                    type: integer
                  disk:
                    type: integer
                  disk_used:
                    type: integer
                  cpu_percent:
                    type: integer
                  memory_percent:
                    type: integer
                  disk_percent:
                    type: integer
              z:
                type: object
                properties:
                  cpu:
                    type: integer
                  cpu_used:
                    type: integer
                  memory:
                    type: integer
                  memory_used:
                    type: integer
                  disk:
                    type: integer
                  disk_used:
                    type: integer
                  cpu_percent:
                    type: integer
                  memory_percent:
                    type: integer
                  disk_percent:
                    type: integer
              # NOTE: This object mirrors that of x and z but as of yet has not
              # been verified.
              pvm:
                type: object
                properties:
                  cpu:
                    type: integer
                  cpu_used:
                    type: integer
                  memory:
                    type: integer
                  memory_used:
                    type: integer
                  disk:
                    type: integer
                  disk_used:
                    type: integer
                  cpu_percent:
                    type: integer
                  memory_percent:
                    type: integer
                  disk_percent:
                    type: integer
              ip:
                type: object
                properties:
                  public:
                    type: object
                    properties:
                      quota:
                        type: integer
                      used:
                        type: integer

    QuotaTransfer:
      type: object
      required:
        - product_group_id
        - site
      properties:
        site:
          type: string
          enum: [svl, rtp]
        product_group_id:
          type: string
        vm:
          type: object
          properties:
            x:
              type: object
              properties:
                cpu:
                  type: string
                memory:
                  type: string
                disk:
                  type: string

    RequestStatus:
      # Updated from actual API response on 2026-04-14
      type: object
      properties:
        status:
          type: string
          description: Status of the response (success, error, etc.)
        request:
          type: object
          description: Request details object
          properties:
            request_id:
              type: string
              description: Unique request identifier
            operation:
              type: string
              description: Type of operation (e.g., "build vm")
            last_status:
              type: string
              description: Last status message from the operation
            last_status_time:
              type: string
              description: Timestamp of last status update
            job_count:
              type: integer
              description: Total number of jobs
            task_count:
              type: integer
              description: Total number of tasks
            complete:
              type: string
              description: Number of completed tasks (as string)
            failed:
              type: string
              description: Number of failed tasks (as string)
            in_progress:
              type: string
              description: Number of tasks in progress (as string)
            pending:
              type: string
              description: Number of pending tasks (as string)
            completion_percent:
              type: integer
              description: Overall completion percentage

    SlotsList:
      type: object
      properties:
        status:
          type: string
        systems:
          type: array
          items:
            $ref: '#/components/schemas/SlotSummary'

    SlotSummary:
      type: object
      properties:
        system_name:
          type: string
        status:
          type: string
        image:
          type: string

    SlotImageList:
      type: object
      properties:
        status:
          type: string
        images:
          type: array
          items:
            type: string

    SlotStartRequest:
      type: object
      properties:
        image:
          type: string
        overwrite:
          type: boolean

    SlotStopRequest:
      type: object
      properties:
        overwrite:
          type: boolean

    SlotDeleteRequest:
      type: object
      properties:
        delete_backups:
          type: boolean

    Snapshot:
      type: object
      properties:
        name:
          type: string
          description: Snapshot name
        comment:
          type: string
          description: Snapshot comment/description
        full_snapshot:
          type: string
          description: Whether this is a full snapshot - "true" or "false" as string
        active:
          type: string
          description: Whether snapshot is active - "true" or "false" as string
        used:
          type: integer
          description: Disk space used by snapshot
        enabled:
          type: string
          description: Whether snapshot is enabled - "y" or "n"
        created:
          type: string
          description: Snapshot creation timestamp
          example: "2026-04-13 14:06:59"

    SnapshotCreateRequest:
      type: object
      required:
        - snapshot_name
      properties:
        snapshot_name:
          type: string
          description: Snapshot name
        snapshot_comment:
          type: string
          description: Comment text
        full_snapshot:
          type: boolean
          description: true for all disks, false for base OS disk only

    SnapshotDeleteRequest:
      type: object
      required:
        - snapshot_name
      properties:
        snapshot_name:
          type: string
          description: Snapshot name to delete

    # Updated from actual API response on 2026-04-13
    SnapshotList:
      type: object
      properties:
        snapshot_count:
          type: string
          description: Number of snapshots (returned as string)
        snapshot_limit:
          type: string
          description: Maximum number of snapshots allowed (returned as string)
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'

    SnapshotRevertRequest:
      type: object
      required:
        - snapshot_name
      properties:
        snapshot_name:
          type: string
          description: Snapshot name to revert to

    StencilCreateRequest:
      type: object
      required:
        - name
        - product_group_id
      properties:
        name:
          type: string
          description: Stencil name
        description:
          type: string
          description: Stencil description
        product_group_id:
          type: string
          description: Product group identifier
        public:
          type: boolean
          default: false
          description: Make stencil public

    StencilDeployRequest:
      type: object
      properties:
        hostname:
          type: string
          description: Hostname for the VM
        description:
          type: string
          description: VM description
        public_network:
          type: string
          enum: ['y', 'n']
          description: Assign public IP address
        expiration:
          type: string
          description: Expiration time in hours or "X days X hours" format

    StencilDetails:
      # Updated from actual API response on 2026-04-13
      type: object
      properties:
        id:
          type: string
          description: Stencil ID
        name:
          type: string
          description: Stencil name
        description:
          type: string
          description: Stencil description
        active:
          type: string
          enum: ['y', 'n']
          description: Whether stencil is active
        private:
          type: string
          enum: ['y', 'n']
          description: Whether stencil is private
        created:
          type: string
          description: Creation timestamp
        updated:
          type: string
          description: Last update timestamp
        site:
          type: string
          enum: [svl, rtp]
          description: Site location
        owner:
          type: object
          properties:
            id:
              type: integer
              description: Owner user ID
            email:
              type: string
              description: Owner email
            username:
              type: string
              description: Owner username
            displayname:
              type: string
              description: Owner display name
        product_group:
          type: object
          properties:
            id:
              type: integer
              description: Product group ID
            product_group:
              type: string
              description: Product group name
        vms:
          type: array
          description: VM configuration details
          items:
            type: object
            properties:
              product_group_id:
                type: integer
              platform:
                type: string
                enum: [x, pvm, z]
              compliance_date:
                type: string
              disk_qty:
                type: integer
              disk_capacity:
                type: string
              interfaces:
                type: array
                items:
                  type: string
                  enum: [private, public]

    StencilList:
      # Updated from actual API response on 2026-04-13
      # Response is a direct array of stencil objects
      type: array
      items:
        $ref: '#/components/schemas/StencilSummary'

    StencilSummary:
      # Updated from actual API response on 2026-04-13
      type: object
      properties:
        stencil_ids:
          type: array
          items:
            type: object
            properties:
              stencil_id:
                type: string
              location:
                type: string
        name:
          type: string
        description:
          type: string
        platform:
          type: string
        type:
          type: string
        product_group_id:
          type: integer
        os:
          type: string
        cpu:
          type: integer
        memory:
          type: integer
        disk_qty:
          type: integer
        disk:
          type: string
        public_ip:
          type: string
        private_ip:
          type: string
        compliance_date:
          type: string
        permission:
          type: string
        created:
          type: string
        updated:
          type: string
        owner:
          type: object
          properties:
            user_id:
              type: integer
            email:
              type: string
            username:
              type: string
            name:
              type: string

    Success:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation completed successfully
        details:
          type: string
          description: Human-readable details about the operation
          example: vm specification change initiated
        request_id:
          type: string
          description: Request identifier for tracking asynchronous operations
          example: "1-233609208"

    UserAPIKeyResponse:
      # Updated from actual API response on 2026-04-22
      type: object
      properties:
        status:
          type: string
          example: info
          description: Response status
        details:
          type: string
          description: Human-readable message about the API key
          example: "Successfully retrieved expiration for api key for user ryan.cragun"
        expiration:
          type: string
          description: API key expiration timestamp
          example: "2026-10-09 10:50:21"

    UserDetails:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
        client_ip:
          type: string
        authenticated:
          type: boolean
        sentry:
          type: object
          properties:
            user_status:
              type: string
            auth_method:
              type: string
            status:
              type: string
            2fa_status:
              type: string
            access:
              type: string
            authenticator:
              type: string
            default_2fa_method:
              type: string
        login:
            type: string
        login_expiration:
            type: integer
        unix_expiration_timestamp:
            type: integer
        programs:
          type: array
          items:
            type: string
        development:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            username:
              type: string
            display_name:
              type: string
            default_product_group_id:
              type: integer
            default_location:
              type: string
            authenticated:
              type: boolean
            valid_api_key:
              type: string
            password_set:
              type: string
            login:
              type: string
            login_expiration:
              type: integer
            default_password_expiration:
              type: string
            product_groups:
              type: array
