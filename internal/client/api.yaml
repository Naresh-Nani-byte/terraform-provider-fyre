    VMPasswordUpdate:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: New password

    VMResourceUpdate:
      type: object
      properties:
        cpu:
          type: integer
          description: Number of CPUs
        memory:
          type: integer
          description: Memory in GB

    VMTransferAccept:
      type: object
      properties:
        ownership_only:
          type: string
          enum: ['y', 'n']
          default: 'n'
          description: Only change ownership without checking VM state

    VMTransferRequest:
      type: object
      properties:
        comment:
          type: string
