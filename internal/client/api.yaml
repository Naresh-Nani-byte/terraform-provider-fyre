                type: object
                properties:
                  id:
                    type: integer
                  product_name:
                    type: string
                  group_name:
                    type: string
            quick_burn:
              type: string
            roles:
              type: array
              items:
                # NOTE: not actually sure of this
                type: string
            product_group_owner:
              type: string
            authorizations:
              #
              type: array
              items:
                # NOTE: not actually sure of this
                type: string
            settings:
              type: array
              items:
                # NOTE: not actually sure of this
                type: string

    UserList:
      type: object
      properties:
        status:
          type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'

    UserQuotaList:
      type: object
      properties:
        status:
          type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserQuotaSummary'

    UserQuotaSummary:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        email:
          type: string
        quota:
          type: object

    UserQuotaUpdate:
      type: object
      properties:
        site:
          type: string
          enum: [svl, rtp]
        vm:
          type: object
          properties:
            x:
              type: object
              properties:
                cpu:
                  type: string
                memory:
                  type: string
                disk:
                  type: string
            pvm:
              type: object
              properties:
                cpu:
                  type: string
                memory:
                  type: string
                disk:
                  type: string
            z:
              type: object
              properties:
                cpu:
                  type: string
                memory:
                  type: string
                disk:
                  type: string
        ip:
          type: object
          properties:
            public:
              type: string
            floating:
              type: string
            port_map:
              type: string

    UserSummary:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        name:
          type: string

    VMAdditionalDisk:
      type: object
      properties:
        size:
          type: integer

    VMCloneRequest:
      type: object
      properties:
        expiration:
          type: string
          description: Expiration time in hours or "X days X hours" format
        ssh_key:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: SSH key(s)
        hostname:
          type: string
          description: Hostname for the cloned VM
        cpu:
          type: integer
          description: Number of CPUs
        memory:
          type: integer
          description: Memory in GB
        disk:
          type: integer
          description: Disk size in GB
        public_network:
          type: string
          enum: ['y', 'n']
          description: Assign public IP address
        dns:
          type: string
          enum: ['y', 'n']
          description: Add hostname to DNS

    VMCreateRequest:
      # Updated from actual API response on 2026-04-14
      type: object
      required:
        - node_array
      properties:
        quota_type:
          type: string
          enum: [product_group, quick_burn]
          default: product_group
          description: Type of quota to use
        product_group_id:
          type: string
          description: Product group identifier (defaults to user's default product group)
        time_to_live:
          type: string
          description: Hours - required if quota_type is quick_burn
        expiration:
          type: string
          description: Expiration time in hours or "X days X hours" format (max 90 days)
        ssh_key:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: SSH key(s) - can be array or comma-separated string
        check_config:
          type: string
          enum: ['y', 'n']
          default: 'n'
          description: If 'y', validates configuration without building
        node_array:
          type: array
          description: Array of VM configurations to create
          items:
            type: object
            required:
              - os
            properties:
              count:
                type: integer
                default: 1
                description: Number of VMs to create with this configuration
              hostname:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                description: Hostname(s) for the VM(s)
              platform:
                type: string
                enum: [x, pvm, z]
                default: x
                description: Platform type
              cpu:
                type: integer
                default: 4
                description: Number of CPUs
              memory:
                type: integer
                default: 8
                description: Memory in GB
              os:
                type: string
                description: Operating system (required)
              description:
                type: string
                description: VM description
              public_network:
                type: string
                enum: ['y', 'n']
                default: 'n'
                description: Provision public IP on VM
              dns:
                type: string
                enum: ['y', 'n']
                default: 'n'
                description: Add hostname to DNS in dev.fyre.ibm.com domain
              additional_disk:
                type: array
                items:
                  type: string
                description: Additional disk sizes in GB (max 2)
                maxItems: 2
              dedicated:
                type: string
                enum: ['y', 'n']
                default: 'n'
                description: Use dedicated host
              dedicated_host:
                type: array
                items:
                  type: string
                description: Specific dedicated host(s) to use

    VMCreateResponse:
      # Updated from actual API response on 2026-04-14
      type: object
      properties:
        status:
          type: string
          description: Status of the response (success, error, etc.)
        details:
          type: string
          description: Details about the operation (e.g., "build initiated")
        vm_id:
          type: string
          description: The VM identifier assigned to the new VM
        request_id:
          type: string
          description: Unique request identifier for tracking the build operation

    VMDeleteResponse:
      # Updated from actual API response on 2026-04-14
      type: object
      properties:
        status:
          type: string
          description: Status of the response (success, error, etc.)
        details:
          type: string
          description: Details about the operation (e.g., "vm deletion initiated")
        request_id:
          type: string
          description: Unique request identifier for tracking the deletion operation

    VMDescriptionUpdate:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          description: VM description

    VMDetails:
      # Updated from actual API response on 2026-04-13
      # Updated additional_disk field from actual API response on 2026-04-20
      # Updated time_remaining field from actual API response on 2026-04-23
      type: object
      properties:
        location:
          type: string
        vm_id:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            email:
              type: string
            display_name:
              type: string
            status:
              type: string
        quota_type:
          type: string
        product_group_id:
          type: integer
        product_group:
          type: string
        hostname:
          type: string
        domain:
          type: string
        description:
          type: string
        state:
          type: string
        pingable:
          type: string
        pingable_last_checked:
          type: string
          nullable: true
        transfer_comment:
          type: string
        sshable:
          type: string
        sshable_last_checked:
          type: string
          nullable: true
        cpu:
          type: integer
        memory:
          type: integer
        os:
          type: string
        platform:
          type: string
        disk_driver:
          type: string
        comment:
          type: string
        expiration:
          type: string
        time_remaining:
          type: string
          description: Human-readable time remaining until expiration
        timezone:
          type: string
        security_lock:
          type: string
        compliance:
          type: string
        disable_delete:
          type: string
        auto_patch:
          type: string
        created:
          type: string
        fqdn:
          type: string
        host_down:
          type: string
        created_iso8601:
          type: string
        os_disk:
          type: integer
        additional_disk:
          type: array
          items:
            type: integer
          description: Array of additional disk sizes in GB
        ips:
          type: array
          items:
            type: object
            properties:
              ip:
                type: string
              type:
                type: string
              scope:
                type: string
        allow_floating_ip:
          type: string

    VMDiskAdd:
      type: object
      required:
        - additional_disk
      properties:
        additional_disk:
          type: array
          items:
            type: integer
          description: Additional disk sizes in GB
          maxItems: 2

    VMIP:
      type: object
      properties:
        ip_address:
          type: string

    VMListResponse:
      # Verified against live GET /vm/product_group/XXX/list on 2026-04-13.
      # GET /vm returned {"status":"info","details":"no vms found"} in the current account,
      # so /vm is modeled to use the same successful list payload shape as the product-group list.
      type: array
      items:
        $ref: '#/components/schemas/VMSummary'

    VMOwnerSummary:
      type: object
      properties:
        user_id:
          type: integer
        email:
          type: string
        username:
          type: string
        displayname:
          type: string

    VMStatus:
      # Updated from actual API response on 2026-04-13
      type: object
      properties:
        last_os_state:
          type: string
          description: The last known operating system state of the VM
        status:
          type: string
          description: Status message about any requests in progress

    VMSummary:
      type: object
