          items:
            type: integer
          description: Additional disk sizes in GB
          maxItems: 2

    VMDescriptionUpdate:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          description: VM description

    VMPasswordUpdate:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: New password

    VMHostnameUpdate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: New hostname for the VM


    StencilCreateRequest:
      type: object
      required:
        - name
        - product_group_id
      properties:
        name:
          type: string
          description: Stencil name
        description:
          type: string
          description: Stencil description
        product_group_id:
          type: string
          description: Product group identifier
        public:
          type: boolean
          default: false
          description: Make stencil public

    StencilDeployRequest:
      type: object
      properties:
        hostname:
          type: string
          description: Hostname for the VM
        description:
          type: string
          description: VM description
        public_network:
          type: string
          enum: ['y', 'n']
          description: Assign public IP address
        expiration:
          type: string
          description: Expiration time in hours or "X days X hours" format

    VMCloneRequest:
      type: object
      properties:
        expiration:
          type: string
          description: Expiration time in hours or "X days X hours" format
        ssh_key:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: SSH key(s)
        hostname:
          type: string
          description: Hostname for the cloned VM
        cpu:
          type: integer
          description: Number of CPUs
        memory:
          type: integer
          description: Memory in GB
        disk:
          type: integer
          description: Disk size in GB
        public_network:
          type: string
          enum: ['y', 'n']
          description: Assign public IP address
        dns:
          type: string
          enum: ['y', 'n']
          description: Add hostname to DNS

    VMTransferRequest:
      type: object
      properties:
        comment:
          type: string
          description: Optional comment for the transfer

    VMTransferAccept:
      type: object
      properties:
        ownership_only:
          type: string
          enum: ['y', 'n']
          default: 'n'
          description: Only change ownership without checking VM state

    SnapshotCreateRequest:
      type: object
      required:
        - snapshot_name
      properties:
        snapshot_name:
          type: string
          description: Snapshot name
        snapshot_comment:
          type: string
          description: Comment text
        full_snapshot:
          type: boolean
          description: true for all disks, false for base OS disk only

    SnapshotRevertRequest:
      type: object
      required:
        - snapshot_name
      properties:
        snapshot_name:
          type: string
          description: Snapshot name to revert to

    SnapshotDeleteRequest:
      type: object
      required:
        - snapshot_name
      properties:
        snapshot_name:
          type: string
          description: Snapshot name to delete

    VIPDeleteRequest:
      type: object
      properties:
        ip_address:
          type: string
          description: Specific IP address to delete

    VIPAttachResponse:
      # Updated from actual API response on 2026-04-14
      type: object
      properties:
        status:
          type: string
          example: success
        details:
          type: string
          description: Human-readable message about the operation
        ips:
          type: array
          items:
            type: object
            properties:
              ip:
                type: string
                description: IP address that was added
              type:
                type: string
                enum: [private, public]
                description: Type of IP address
        default_gateway:
          type: string
          description: Default gateway for the network
        subnet_mask:
          type: string
          description: Subnet mask for the network
        request_id:
          type: string
          description: Request identifier

    VIPDeleteResponse:
      # Updated from actual API response on 2026-04-14
      type: object
      properties:
        status:
          type: string
          example: success
        details:
          type: string
          description: Human-readable message about the operation
        ips:
          type: array
          items:
            type: string
          description: List of IP addresses that were removed
        request_id:
          type: string
          description: Request identifier

    FloatingIPRequest:
      type: object
      required:
        - floating_ip
      properties:
        floating_ip:
          type: string
          description: Floating IP address

    ExpirationUpdate:
      type: object
      required:
        - expiration
      properties:
        expiration:
          type: string
          description: Expiration time in hours or "X days X hours" format (max 90 days)

    StencilDeleteRequest:
      type: object
      required:
        - confirm
      properties:
        confirm:
          type: string
          enum: ['yes']
          description: Confirmation required

    ClusterCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Cluster name
        description:
          type: string
          description: URL-encoded description

    ClusterUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Cluster name
        description:
          type: string
          description: URL-encoded description

    ClusterVMRequest:
      type: object
      required:
        - vm_id
      properties:
        vm_id:
          type: array
          items:
            type: string
          description: Array of VM IDs

paths:
  /quota:
    get:
      tags:
        - Quota
      summary: Get quota information
      description: Get all quotas for product groups you're part of
      operationId: getQuota
      parameters:
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vm/:
    get:
      tags:
        - VMs
      summary: List all VMs
      description: Get list of all VMs accessible to the authenticated user
      operationId: listVMs
      parameters:
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - VMs
      summary: Create VM(s)
      description: Provision one or more VMs with specified configuration
      operationId: createVM
      parameters:
        - $ref: '#/components/parameters/siteQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMCreateRequest'
            examples:
              simple:
                summary: Simple VM creation
                value:
                  platform: x
                  os: RHEL9
                  cpu: 2
                  memory: 4
                  disk: 100
                  hostname: myvm
              multiple:
                summary: Create multiple VMs
                value:
                  platform: x
                  os: RHEL9
                  cpu: 4
                  memory: 8
                  disk: 200
                  count: 3
      responses:
        '200':
          description: VM creation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMCreateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /vm/product_group/{product_group_id}/list:
