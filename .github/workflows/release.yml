---
name: release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The sha to associated with the release
        required: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.get-go-version.outputs.go-version }}
      product-version: ${{ steps.set-product-version.outputs.product-version }}
      product-base-version: ${{ steps.set-product-version.outputs.base-product-version }}
      product-prerelease-version: ${{ steps.set-product-version.outputs.prerelease-product-version }}
      product-minor-version: ${{ steps.set-product-version.outputs.minor-product-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
      - id: get-go-version
        run: |
          version="$(go list -f '{{.GoVersion}}' -m)"
          echo "go-version=$version" | tee -a "$GITHUB_OUTPUT"
      - id: set-product-version
        uses: hashicorp/actions-set-product-version@2ec1b51402b3070bccf7ca95306afbd039e574ff # v2.0.1
      - run: go mod download # so that the modules are cached

  build:
    needs:
      - setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos:
          - linux
          - darwin
        goarch:
          - amd64
          - arm64
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: hashicorp/actions-go-build@b9e2cfba3013adccdc112b01cba922d83c78fac5 # v1.1.1
        env:
          CGO_ENABLED: 0
          BASE_VERSION: ${{ needs.setup.outputs.product-base-version }}
          PRERELEASE_VERSION: ${{ needs.setup.outputs.product-prerelease-version}}
          METADATA_VERSION: ${{ env.METADATA }}
        with:
          bin_name: "terraform-provider-fyre_v${{ needs.setup.outputs.product-version }}"
          product_name: terraform-provider-fyre
          product_version: ${{ needs.setup.outputs.product-version }}
          go_version: ${{ needs.setup.outputs.go-version }}
          os: ${{ matrix.goos }}
          arch: ${{ matrix.goarch }}
          reproducible: report
          instructions: |
            go build \
              -o "$BIN_PATH" \
              -trimpath \
              -buildvcs=false \
              -ldflags "-s -w -X 'main.version=${{ needs.setup.outputs.product-version }}'"
            cp LICENSE "$TARGET_DIR/LICENSE.txt"

  release:
    needs:
      - setup
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          ref: ${{ inputs.sha }}   # checkout out our sha to get the version
      # Check out the enos-provider repository so we can use it's machinery
      # to publish the provider until it's available in the generic pipeline
      # tooling.
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          repository: "hashicorp-forge/terraform-provider-enos"
          path: enos-provider
          token: ${{ secrets.SERVICE_USER_GITHUB_TOKEN }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          pattern: terraform-provider-fyre_*
          merge-multiple: true
      - run: |
          pushd dist
          ls -al
          unzip *.zip
          rm -f *.zip
          chmod +x .
      - name: Import gpg key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Create a Github release
        env:
          GITHUB_TOKEN: ${{ secrets.SERVICE_USER_GITHUB_TOKEN }}
        run: |
          gpg --list-signatures
          # actions/download-artifact doesn't preserve file permissions. Reset the exec bits.
          chmod 755 dist/*
          pushd enos-provider
          go run ./tools/publish/cmd github create \
            --provider-name fyre \
            --binary-name terraform-provider-fyre \
            --repo hashicorp-forge/terraform-provider-fyre \
            --dist ../dist \
            --gpg-key-id "${{ secrets.GPG_KEY_ID }}" \
            --commit "${{ inputs.sha }}" \
            --version "$(cat VERSION)" \
            --manifest-path ../terraform-registry-manifest.json
