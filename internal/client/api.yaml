  /stencils:
    get:
      tags:
        - Stencils
      summary: List stencils
      description: |
        Get list of available stencils. This endpoint supports flexible URL-based filtering
        where filter segments can be combined in any order after /stencils.

        Available filter segments:
        - `/product_group/{id}` - Only stencils from specified product group
        - `/public` - Only public stencils
        - `/private` - Only private stencils
        - `/site/{site}` - Stencils available at provided site (svl or rtp)
        - `/my_stencils` - Only stencils owned by authenticating user

        Examples of valid combinations:
        - `/stencils` - All accessible stencils
        - `/stencils/public` - All public stencils
        - `/stencils/public/site/rtp` - Public stencils at RTP site
        - `/stencils/product_group/753/public` - Public stencils in product group 753
        - `/stencils/site/rtp/product_group/753` - Product group 753 stencils at RTP
        - `/stencils/private/site/svl` - Private stencils at SVL site

        Note: Filters can be combined in any order. The API uses URL path segments
        rather than query parameters for filtering. OpenAPI cannot handle
        arbitrary path segments so we only enumarate a few.

        Updated from actual API testing on 2026-04-13
      operationId: listStencils
      parameters:
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StencilList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stencil/{stencil_id}:
    get:
      tags:
        - Stencils
      summary: Get stencil details
      description: |
        Get detailed information about a specific stencil by ID.

        Updated from actual API response on 2026-04-13
      operationId: getStencilDetails
      parameters:
        - $ref: '#/components/parameters/stencilId'
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StencilDetails'
        '404':
          description: Stencil not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stencils/product_group/{product_group_id}:
    get:
      tags:
        - Stencils
      summary: List stencils by product group
      description: |
        Get list of stencils filtered by product group ID.

        This filter can be combined with other filters in any order:
        - `/stencils/product_group/{id}/public` - Public stencils in product group
        - `/stencils/product_group/{id}/private` - Private stencils in product group
        - `/stencils/product_group/{id}/site/{site}` - Product group stencils at site
        - `/stencils/site/{site}/product_group/{id}` - Same as above, different order

        Updated from actual API testing on 2026-04-13
      operationId: listStencilsByProductGroup
      parameters:
        - $ref: '#/components/parameters/productGroupId'
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StencilList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stencils/public:
    get:
      tags:
        - Stencils
      summary: List public stencils
      description: |
        Get list of public stencils available to all users.

        This filter can be combined with other filters in any order:
        - `/stencils/public/site/{site}` - Public stencils at specific site
        - `/stencils/public/product_group/{id}` - Public stencils in product group
        - `/stencils/site/{site}/public` - Same as first, different order

        Updated from actual API testing on 2026-04-13
      operationId: listPublicStencils
      parameters:
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
