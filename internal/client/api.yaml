        ips:
          type: array
          items:
            type: string
          description: List of IP addresses that were removed
        request_id:
          type: string
          description: Request identifier

paths:
  # Cluster API endpoints
  /clusters:
    get:
      tags:
        - Clusters
      summary: List clusters
      description: Get list of user clusters
      operationId: listClusters
      parameters:
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Clusters
      summary: Create cluster
      description: Create a new cluster
      operationId: createCluster
      parameters:
        - $ref: '#/components/parameters/siteQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateRequest'
      responses:
        '200':
          description: Cluster created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clusters/{cluster_identifier}:
    get:
      tags:
        - Clusters
      summary: Get cluster details
      description: Get details of a specific cluster
      operationId: getClusterDetails
      parameters:
        - $ref: '#/components/parameters/clusterIdentifier'
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDetails'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Clusters
      summary: Update cluster
      description: Update cluster name or description
      operationId: updateCluster
      parameters:
        - $ref: '#/components/parameters/clusterIdentifier'
        - $ref: '#/components/parameters/siteQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdateRequest'
      responses:
        '200':
          description: Cluster updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Clusters
      summary: Delete cluster
      description: Delete a cluster (VMs are not affected)
      operationId: deleteCluster
      parameters:
        - $ref: '#/components/parameters/clusterIdentifier'
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Cluster deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clusters/{cluster_identifier}/add_vm:
    patch:
      tags:
        - Clusters
      summary: Add VMs to cluster
      description: Add one or more VMs to a cluster
      operationId: addVMsToCluster
      parameters:
        - $ref: '#/components/parameters/clusterIdentifier'
        - $ref: '#/components/parameters/siteQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterVMRequest'
      responses:
        '200':
          description: VMs added to cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clusters/{cluster_identifier}/include_vms:
    get:
      tags:
        - Clusters
      summary: Get cluster details with VMs
      description: Get details of a specific cluster including VM information
      operationId: getClusterDetailsWithVMs
      parameters:
        - $ref: '#/components/parameters/clusterIdentifier'
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDetails'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clusters/{cluster_identifier}/remove_vm:
    patch:
      tags:
        - Clusters
      summary: Remove VMs from cluster
      description: Remove one or more VMs from a cluster
      operationId: removeVMsFromCluster
      parameters:
        - $ref: '#/components/parameters/clusterIdentifier'
        - $ref: '#/components/parameters/siteQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterVMRequest'
      responses:
        '200':
          description: VMs removed from cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # NFS Storage API endpoints
  /nfs/storage:
    get:
      tags:
        - NFS Storage
      summary: Get user NFS storage
      description: Get all NFS Storage you have
      operationId: getNFSStorage
      parameters:
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSStorageList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nfs/storage/{product_group_id}:
    get:
      tags:
        - NFS Storage
      summary: Get deployed storage for product group
      description: Get all NFS Storage for your product group
      operationId: getNFSStorageByProductGroup
      parameters:
        - $ref: '#/components/parameters/productGroupId'
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSStorageList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nfs/storage/{storage_name}:
    delete:
      tags:
        - NFS Storage
      summary: Delete NFS storage
      description: Delete NFS storage
      operationId: deleteNFSStorage
      parameters:
        - name: storage_name
          in: path
          required: true
          description: Storage name
          schema:
            type: string
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Storage deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nfs/permissions/{storage_name}:
    get:
      tags:
        - NFS Storage
      summary: Get storage permissions
      description: Get all permissions for storage share
      operationId: getNFSPermissions
      parameters:
        - name: storage_name
          in: path
          required: true
          description: Storage name
          schema:
            type: string
        - $ref: '#/components/parameters/siteQuery'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFSPermissionsList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - NFS Storage
      summary: Update storage permissions
      description: Update permissions for storage share
      operationId: updateNFSPermissions
      parameters:
        - name: storage_name
          in: path
          required: true
          description: Storage name
          schema:
            type: string
        - $ref: '#/components/parameters/siteQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFSPermissionsUpdate'
      responses:
        '200':
          description: Permissions updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nfs/check_name/{name}:
    get:
      tags:
        - NFS Storage
