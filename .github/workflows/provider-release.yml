# provider-release is a convenient way to request a promotion of artifacts to
# the staging or production release channel via Common Release Tooling (CRT).
#
# Access control: even though this workflow is runnable by users with Write access,
# it dispatches only the `trigger-promotion` workflows. The `promote-production`
# workflow is gated by a deployment approval, which is limited to an authorized
# release approvers team.
#
# Inspired by prior art in hashicorp/terraform-releases and hashicorp/terraform-ls
#
# This workflow relies on the GitHub Checks API. For private and internal
# repos, this means that personal access tokens cannot be used as a GitHub auth
# mechanism.

name: Release Provider

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: "The version to release"
        required: true
        default: "0.0.0"
      release-branch:
        description: "The branch to release from"
        required: true
        default: "main"
      git-commit-sha:
        description: "The git commit SHA to tag"
        required: true
      release-channel:
        description: "The channel to release to"
        required: true
        type: choice
        options:
          - "staging"
          - "production"
        default: "staging"

env:
  slack_channel: "C09KJPFT29M" #feed-enos
  product_name: "terraform-provider-fyre"
  repo_name: "hashicorp-forge"
  deployment_environment_name: "terraform-provider-fyre"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: "bob - setup"
        uses: hashicorp/action-setup-bob@01076d9cc869139ac97693d0869f0e80a666cb3b # v2.1.1
        with:
          # TODO: set BOB_GITHUB_TOKEN in your provider repo's Actions secrets
          # to a fine-grained personal access token for a service account. Do
          # not use your individual GitHub account for this.
          #
          # You will need to generate a limited-scope access token with the following settings:
          #
          # "Resource owner" must be the hashicorp organization.
          #
          # Limit the token to the following repositories:
          #   hashicorp/{{ provider repo name }}
          #   hashicorp/crt-workflows-common
          #   hashicorp/bob
          #
          # Under the repository permissions section, select:
          #   "Actions" to Read/Write
          #   "Commit statuses" to Read/Write
          #   "Contents" to Read/Write
          #   "Environments" to Read/Write
          #   "Metadata" to "Read only" (which is the default)
          #   "Pull requests" to Read/Write
          #
          # Set the expiration date to the maximum allowed time (366 days as of time of writing).
          github-token:
            ${{ secrets.BOB_GITHUB_TOKEN }}

      - name: "promote to ${{ inputs.release-channel }}"
        env:
          BOB_GITHUB_TOKEN: ${{ secrets.BOB_GITHUB_TOKEN }}
        run: |
          bob trigger-promotion \
            -product-name ${{ env.product_name }} \
            -org hashicorp \
            -repo ${{ env.repo_name }} \
            -product-version ${{ inputs.release-version }} \
            -sha ${{ inputs.git-commit-sha }} \
            -branch ${{ inputs.release-branch }} \
            -slack-channel ${{ env.slack_channel }} \
            -environment ${{ env.deployment_environment_name }} \
            ${{ inputs.release-channel }}
