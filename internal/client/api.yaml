openapi: 3.0.0
info:
  title: Fyre VM API
  description: |
    API for managing virtual machines, clusters, and stencils in the Fyre development cloud environment.

    ## Authentication
    This API uses HTTP Basic Authentication with your Fyre username and API key.

    ## Sites
    The API is available at two sites:
    - SVL (San Jose, Silicon Valley Labs)
    - RTP (Raleigh, Research Triangle Park)

    You can specify the site using the `site` query parameter or in the request body.
    Default site is SVL if not specified.

    ## VM Identifiers
    Many endpoints accept a VM identifier which can be:
    - VM ID (format: x-xxxxxxx)
    - IP address
    - Fully Qualified Domain Name (FQDN) - must be in DNS
  version: 1.0.0
  contact:
    name: DevIT Support
    url: https://w3.ibm.com/w3publisher/devit/support
  license:
    name: IBM Internal Use
    url: https://terms.devit.ibm.com/tous/12

servers:
  - url: https://ocpapi.svl.ibm.com/v1
    description: SVL (San Jose) Production Server

security:
  - basicAuth: []

tags:
  - name: Quota
    description: Operations related to quota management
  - name: VMs
    description: Operations for managing virtual machines
  - name: VM Actions
    description: Power and state management operations for VMs
  - name: Stencils
    description: Operations for creating and managing VM templates (stencils)
  - name: Snapshots
    description: Operations for managing VM snapshots
  - name: Clusters
    description: Operations for managing VM clusters
  - name: Users
    description: Operations related to user information
  - name: Networking
    description: Operations for managing IP addresses and networking

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using Fyre username and API key

  parameters:
    vmIdentifier:
      name: vm_identifier
      in: path
      required: true
      description: VM identifier (can be VM ID, IP address, or FQDN)
      schema:
        type: string
      example: x-1234567

    clusterIdentifier:
      name: cluster_identifier
      in: path
      required: true
      description: Cluster identifier (can be cluster ID or name)
      schema:
        type: string

    productGroupId:
      name: product_group_id
      in: path
      required: true
      description: Product group identifier
      schema:
        type: string

    stencilId:
      name: stencil_id
      in: path
      required: true
      description: Stencil identifier
      schema:
        type: string

    requestId:
      name: request_id
      in: path
      required: true
      description: Request identifier
      schema:
        type: string

    platform:
      name: platform
      in: path
      required: true
      description: Platform type
      schema:
        type: string
        enum: [x, pvm, z]
      example: x

    hostname:
      name: hostname
      in: path
      required: true
      description: Hostname to check availability
      schema:
        type: string

    search:
      name: search
      in: path
      required: true
      description: Search term (email or name)
      schema:
        type: string

    vmAction:
      name: action
      in: path
      required: true
      description: VM power action
      schema:
        type: string
        enum: [boot, shutdown, reboot]

    userIdentifier:
      name: user_identifier
      in: path
      required: true
      description: User identifier (can be user ID, username, or email)
      schema:
        type: string

    vipType:
      name: vip_type
      in: path
      required: true
      description: Virtual IP type
      schema:
        type: string
        enum: [private, public]

    vipCount:
      name: count
      in: path
      required: false
      description: Number of IPs to allocate
      schema:
        type: integer
        minimum: 1

    vipSequential:
      name: sequential
      in: path
      required: false
      description: Request sequential IPs
      schema:
        type: string
        enum: [sequential]

    siteQuery:
      name: site
      in: query
      required: false
      description: Site location (svl or rtp)
      schema:
        type: string
        enum: [svl, rtp]
        default: svl

  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Error message description
        details:
          type: string
          description: Human-readable details about the error
          example: "VM password has not been changed because the vm is not running"

    Success:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation completed successfully
        details:
          type: string
          description: Human-readable details about the operation
          example: vm specification change initiated
        request_id:
          type: string
          description: Request identifier for tracking asynchronous operations
          example: "1-233609208"

    QuotaResponse:
      type: object
      properties:
        status:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              product_group_id:
                type: integer
              product_group_name:
                type: string
              platforms:
                type: array
                items:
                  type: string
              # TODO: add pvn and z when we're sure what they look like
              x:
                type: object
                properties:
                  cpu:
                    type: integer
                  cpu_used:
                    type: integer
                  memory:
                    type: integer
                  memory_used:
                    type: integer
                  disk:
                    type: integer
                  disk_used:
                    type: integer
                  cpu_percent:
                    type: integer
                  memory_percent:
                    type: integer
                  disk_percent:
                    type: integer
              ip:
                type: object
                properties:
                  public:
                    type: object
                    properties:
                      quota:
                        type: integer
                      used:
                        type: integer

    # Verified against live GET /vm/product_group/753/list on 2026-04-13.
    # GET /vm returned {"status":"info","details":"no vms found"} in the current account,
    # so /vm is modeled to use the same successful list payload shape as the product-group list.
