        os:
          type: string
        os_disk:
          type: integer
        total_disk:
          type: integer
        snapshot_disk:
          type: integer
        ips:
          type: array
          items:
            $ref: '#/components/schemas/VMIP'
        additional_disks:
          type: array
          items:
            $ref: '#/components/schemas/VMAdditionalDisk'
        allow_floating_ip:
          type: string
        added_to_cluster:
          type: string
